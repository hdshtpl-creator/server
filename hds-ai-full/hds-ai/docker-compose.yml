services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: hds-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hds
      # Không đặt mật khẩu mặc định: thiếu DB_PASSWORD thì compose dừng ngay
      # kèm thông báo, thay vì lặng lẽ dựng CSDL bằng mật khẩu ai cũng biết.
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Thieu DB_PASSWORD - hay tao .env tu .env.example}
      POSTGRES_DB: hdsai
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hds -d hdsai"]
      interval: 10s
      timeout: 5s
      retries: 5
    shm_size: 512mb
volumes:
  pgdata:
